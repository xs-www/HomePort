# ==============================================================================
# HomePort（母港）门户 — 一键启动
#
#   docker compose up -d --build
#
# 设计原则：**同一份 compose 在 Windows（Docker Desktop）与 NAS（Linux）上都能跑**，
# 平台差异全部通过 `.env` 变量表达（见 .env.example 的「部署矩阵」）。
#
# 首次启动后从日志取初始化令牌：
#   docker compose logs homeport | Select-String "初始化令牌"     # Windows
#   docker compose logs homeport | grep 初始化令牌                 # Linux/NAS
#
# 从旧名 HomePage 升级过来（服务名/homepage → homeport，数据卷同名变化）：
#   1) 先迁移数据卷，保住已初始化的 admin 账号（旧卷不会被删除，可回退）：
#        docker volume create homeport-data
#        docker run --rm -v homepage-data:/from:ro -v homeport-data:/to alpine sh -c "cp -a /from/. /to/"
#      不想迁移也行：新卷是空的，启动后重新走一次首启初始化即可。
#   2) 再启动，并清掉旧容器（旧容器仍占着 8899 端口，不清会启动失败）：
#        docker compose up -d --build --remove-orphans
# ==============================================================================

services:
  homeport:
    build:
      context: .
      dockerfile: Dockerfile
    image: homeport:local
    container_name: homeport-portal
    restart: unless-stopped

    ports:
      # 绑定地址：默认 0.0.0.0（tailnet + 局域网均可访问）；
      # 只想经 tailnet 访问时改成宿主 tailnet IP，如 100.72.255.29:8899:8899
      - "${PORTAL_BIND_ADDR:-0.0.0.0}:${PORTAL_HOST_PORT:-8899}:8899"

    environment:
      NODE_ENV: production
      PORTAL_PORT: "8899"
      PORTAL_HOST: "0.0.0.0"
      PORTAL_DATA_DIR: /data
      PORTAL_LOG_LEVEL: "${PORTAL_LOG_LEVEL:-info}"
      # 门户对外的公开主机名（MagicDNS 名或 tailnet IP）。
      # 留空时按访问者请求头推导，通常无需设置。
      PORTAL_PUBLIC_HOST: "${PORTAL_PUBLIC_HOST:-}"
      # 部署在 HTTPS 反代之后时置 1，会话 Cookie 会带上 Secure
      PORTAL_SECURE_COOKIES: "${PORTAL_SECURE_COOKIES:-0}"
      # 首启令牌：留空则自动生成并写入 /data/setup-token.txt，同时打印到日志
      PORTAL_SETUP_TOKEN: "${PORTAL_SETUP_TOKEN:-}"

      # ---- Docker 数据源（只读）
      # 容器内一律用 unix socket。Docker Desktop 会把 Windows named pipe 转发为
      # 容器内的 /var/run/docker.sock，所以 Windows 容器化部署**也**用这个值。
      # npipe:// 写法只用于「在 Windows 上原生跑 Node」的开发场景。
      DOCKER_ENDPOINT: "${DOCKER_ENDPOINT:-unix:///var/run/docker.sock}"

      # ---- tailnet 数据源
      # auto：有 API Token 就用 API，否则用 CLI
      PORTAL_TAILSCALE_MODE: "${PORTAL_TAILSCALE_MODE:-auto}"
      PORTAL_TAILSCALE_BIN: "${PORTAL_TAILSCALE_BIN:-/usr/local/bin/tailscale}"
      PORTAL_TAILSCALE_SOCKET: "${PORTAL_TAILSCALE_SOCKET:-/var/run/tailscale/tailscaled.sock}"
      PORTAL_TAILSCALE_API_TOKEN: "${PORTAL_TAILSCALE_API_TOKEN:-}"

      # ---- 宿主 /proc（Linux 宿主必挂；Windows 上可忽略，见注释）
      PORTAL_HOST_PROC: "${PORTAL_HOST_PROC:-/host/proc}"

      # ---- 磁盘挂载点（宿主路径=容器内路径[|标签|statfs 路径]）
      # Linux/NAS 示例： /volume1=/host/volume1, /volume2=/host/volume2
      # Windows 示例：   C:=/host/disk/C
      PORTAL_DISK_MOUNTS: "${PORTAL_DISK_MOUNTS:-}"

      # ---- GPU
      PORTAL_NVIDIA_SMI: "${PORTAL_NVIDIA_SMI:-/usr/local/bin/nvidia-smi}"
      PORTAL_NVIDIA_LD_LIBRARY_PATH: "${PORTAL_NVIDIA_LD_LIBRARY_PATH:-}"

      # ---- 工具目录
      PORTAL_TOOLS_FILE: "${PORTAL_TOOLS_FILE:-}"
      PORTAL_TOOLS_EXTRA: "${PORTAL_TOOLS_EXTRA:-}"
      PORTAL_TOOLS_PROBE_TTL_MS: "${PORTAL_TOOLS_PROBE_TTL_MS:-10000}"

      # ---- 安全（Sprint 0 · S0-03）----
      # 安全响应头：默认开。CSP 留空表示用内置默认策略（见 docs/static/06-security.md）。
      PORTAL_SECURITY_HEADERS: "${PORTAL_SECURITY_HEADERS:-1}"
      PORTAL_CSP: "${PORTAL_CSP:-}"
      # HSTS：只在检测到 HTTPS 时下发；直连 HTTP（含 tailnet 直连）时自动不下发。
      PORTAL_HSTS: "${PORTAL_HSTS:-1}"
      PORTAL_HSTS_MAX_AGE: "${PORTAL_HSTS_MAX_AGE:-15552000}"
      # 反代信任边界：loopback = 只信任来自本机反代（tailscale serve）的转发头。
      # 门户**不经过反代直接暴露**时才改成 0，否则限流会把所有人算成同一个 IP。
      PORTAL_TRUST_PROXY: "${PORTAL_TRUST_PROXY:-loopback}"
      # 敏感值加密主密钥（AES-256-GCM）。留空则自动生成 /data/secret.key（0600），
      # 随数据卷持久化 —— 这是推荐做法：密钥不进镜像、不进 compose、不进 git。
      # 轮换密钥时把旧密钥填到 PORTAL_SECRET_KEY_PREVIOUS（逗号分隔）再改主密钥。
      PORTAL_SECRET_KEY: "${PORTAL_SECRET_KEY:-}"
      PORTAL_SECRET_KEY_FILE: "${PORTAL_SECRET_KEY_FILE:-}"
      PORTAL_SECRET_KEY_PREVIOUS: "${PORTAL_SECRET_KEY_PREVIOUS:-}"

      # ---- 两步验证（TOTP，Sprint 0 · S0-03）----
      # 关掉只是"不允许新绑定"，已经绑定的账号仍会继续要求第二步（避免静默降级）。
      PORTAL_TOTP_ENABLED: "${PORTAL_TOTP_ENABLED:-1}"
      PORTAL_TOTP_ISSUER: "${PORTAL_TOTP_ISSUER:-HomePort}"
      PORTAL_TOTP_WINDOW: "${PORTAL_TOTP_WINDOW:-1}"
      PORTAL_TOTP_CHALLENGE_TTL_SECONDS: "${PORTAL_TOTP_CHALLENGE_TTL_SECONDS:-300}"

      # ---- 指标与缓存
      PORTAL_METRICS_INTERVAL_MS: "${PORTAL_METRICS_INTERVAL_MS:-3000}"
      PORTAL_SESSION_TTL_HOURS: "${PORTAL_SESSION_TTL_HOURS:-12}"

      TZ: "${TZ:-Asia/Shanghai}"

    volumes:
      # 门户数据（SQLite + 首启令牌）—— 必须持久化，否则每次重建都要重新初始化。
      # 卷名随项目改名为 homeport-data；从 HomePage 升级需按文件头注释迁移数据。
      - homeport-data:/data
      # Docker 引擎（**只读**）。
      # 门户只做读取（list/inspect/logs/stats），从不创建、启动、停止或删除容器，
      # 因此 socket 以 :ro 挂载 —— 万一面门被攻破，攻击者也无法通过这个挂载点
      # 直接改写它（真正的最小权限解法见 docker-compose.socket-proxy.yml）。
      # Windows 上若下面那行报错，改用：
      #   - //var/run/docker.sock:/var/run/docker.sock:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro

      # ---- 宿主磁盘（**按需启用**；路径各平台不同，故默认全部注释）----
      # 启用后必须同时在 .env 的 PORTAL_DISK_MOUNTS 里登记，否则门户不会展示该磁盘。
      #
      # Windows（Docker Desktop）：
      #   - "C:/:/host/disk/C:ro"
      #   盘符必须写成 "C:/"（**带斜杠**）并加引号；写成 C: 会被 Compose 当成
      #   相对路径解析成 <项目目录>/C: 而挂载失败。
      #   其它盘按需追加： - "D:/:/host/disk/D:ro"
      #
      # NAS / Linux：
      #   - /volume1:/host/volume1:ro
      #
      # 为什么不给默认值：默认挂 "C:/" 会让 Linux/NAS 上 docker compose 直接报错
      # （宿主不存在该路径，部分版本还会悄悄创建出目录），而默认挂 "/" 又是
      # 把整个根文件系统交给容器 —— 两种默认都不能要，因此交给部署者显式开启。
      #
      # 建议写在 **docker-compose.override.yml** 里：compose 会自动合并它，
      # 而它依赖具体机器的路径，因此已在 .gitignore 中忽略（本机不动仓库即可生效）。
      # 例（Windows）：      volumes: ["C:/:/host/disk/C:ro"]
      # 例（NAS / Linux）：  volumes: ["/volume1:/host/volume1:ro"]

      # ---- 以下挂载默认注释，按平台启用 ----
      # Linux/NAS：宿主 /proc（拿真实 CPU/内存）
      # - /proc:/host/proc:ro
      #
      # Linux/NAS：宿主 tailscale（CLI 模式）
      # - /usr/bin/tailscale:/usr/local/bin/tailscale:ro
      # - /var/run/tailscale:/var/run/tailscale:ro
      #
      # 注意：Windows 上**不要**挂 /proc（那是 WSL2 虚拟机视图，与任务管理器对不上），
      # 也不要试图挂 nvidia-smi.exe（Linux 容器执行不了 Windows 可执行文件）。
      # 详见 docs/static/08-operations.md 的「指标取数边界」。

    # ---- 最小权限（Sprint 0 · S0-04）----
    # 门户只读 Docker、只读宿主文件、把日志写到 stdout，不需要任何 capability，
    # 也不需要 setuid/setgid 提权路径。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    #
    # 进一步收紧（可选，按需取消注释）：把根文件系统挂成只读。
    # 已确认门户只写两处：/data（命名卷）与 /tmp（Node 临时文件），
    # 因此同时需要 tmpfs。保持 /data 可写是必须的（SQLite + 首启令牌 + 主密钥）。
    #
    # read_only: true
    # tmpfs:
    #   - /tmp:size=64m,mode=1777
    #
    # 默认不开启的原因：NAS 上的 Docker/Compose 版本差异较大，个别版本对
    # `read_only` + 命名卷 + group_add 的组合处理不一致；而它带来的额外收益
    # 小于"部署直接起不来"的风险。要开就按上面两行开，并在 08-operations.md 里
    # 记录你验证过的版本。

    # 让容器内的 host.docker.internal 指向宿主。
    # Docker Desktop（Windows/macOS）自带这个域名；Linux/NAS 需要这行才会生效。
    # 用途：工具可用性探测需要从容器内访问宿主上的服务（Ollama/ComfyUI 等）。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # NAS 上 Docker 组 ID 常为 998/100/0，出现 EACCES 时在 .env 里设置
    # DOCKER_GID=998
    group_add:
      - "${DOCKER_GID:-0}"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8899/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # 日志轮转，避免长期运行撑爆 NAS 磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  homeport-data:
    name: homeport-data
