# ==============================================================================
# 在 GitHub 的机器上构建镜像并推送到 GHCR
#
# 产物：ghcr.io/xs-www/homeport
#   - latest   （默认分支 master）
#   - master   （分支名）
#   - sha-<短> （每次提交，便于回滚到具体版本）
#   - v1.2.3   （打 tag 时，配合 semver）
#
# 同时构建 linux/amd64 与 linux/arm64，产出多架构 manifest list，
# 使 x86 主机与 NAS（family-nas）拉同一个标签即可各取所需架构。
#
# 为什么关掉 provenance / sbom：
#   这两项会产出 attestation manifest。较老的 Docker（如 NAS 上的 20.10，
#   containerd 镜像存储未启用）拉取时会报 "no match for platform in manifest"。
#   多架构 manifest list 本身没问题，但**必须**保持 attestation 关闭，
#   否则较老 Docker 依旧会挑不中平台。本镜像的消费方正是这类设备，故关闭。
#
# 质量门禁（Sprint 0 / S0-02）：
#   `build-and-push` 依赖同文件的 `quality` job（typecheck + 单元测试 + 构建）。
#   测试不过就没有镜像被推送 —— 这是"只有测试通过才触发构建发布"的落点。
#   本工作流**没有 pull_request 触发**，因此外部 fork 的 PR 拿不到
#   `secrets.GITHUB_TOKEN` 与 `packages: write`，生产密钥不会暴露给 PR。
# ==============================================================================

name: Build & Push Image

on:
  push:
    branches: [master]
    tags: ['v*']
    # 纯文档/元数据改动不会影响镜像内容，跳过构建以省 CI 时间。
    # 注意：需要出图时用 workflow_dispatch 手动触发即可。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      # compose 文件不影响镜像内容（Dockerfile 不会 COPY 它们）
      - 'docker-compose*.yml'
  # 允许在 Actions 页面手动触发（换架构/临时出图时不必空提交）
  workflow_dispatch:

# 同一分支上新的推送会取消仍在跑的旧构建，避免排队等待
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # 注意：Docker 镜像引用必须全小写。仓库名是 HomePort，但镜像名只能是 homeport，
  # 因此不能直接用 ${{ github.repository }}（会得到 xs-www/HomePort 而报
  # "repository name must be lowercase"）。
  IMAGE_NAME: ${{ github.repository_owner }}/homeport
  # 目标架构。只出单架构时写 linux/arm64 或 linux/amd64 可显著缩短构建时间。
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # ---- 质量门禁：不过就不发布镜像 ----
  # 这里重复了 ci.yml 的步骤而不是复用 ci.yml：两个工作流的触发条件不同
  # （本文件有 paths-ignore，ci.yml 没有），且发布门禁必须**自证**——
  # 依赖另一个工作流的结论会引入"那个工作流被跳过/改名后门禁静默失效"的风险。
  # 任何一边改了步骤，`server/tests/ciWorkflow.test.ts` 会把不一致打红。
  quality:
    name: 类型检查 · 单元测试 · 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck（server + web）
        run: npm run typecheck

      - name: Unit tests（server + web）
        run: npm test

      - name: Production build（web + server）
        run: npm run build

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 推 GHCR 必需。若仓库 Settings → Actions → General → Workflow permissions
      # 被设为只读，则此处无法生效，推送会 403（见 README/文档说明）。
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 镜像要在 amd64 runner 上构建，必须注册 QEMU 模拟。
      # 代价：better-sqlite3 的原生编译在模拟下较慢（实测本机 QEMU 约 77s）。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 跨构建缓存，避免每次都在 QEMU 下重编 better-sqlite3
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Summary
        run: |
          {
            echo "### 镜像已推送 :whale:"
            echo ""
            echo "平台：\`${{ env.PLATFORMS }}\`"
            echo ""
            echo "标签："
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "NAS 上拉取："
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
